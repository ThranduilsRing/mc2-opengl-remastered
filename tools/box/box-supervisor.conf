; box-supervisor under supervisord (copied, not linked, to /etc/supervisor/conf.d/box-supervisor.conf by tools/box/deploy.sh).
; The watchdog restarts dead filler workers, reaps stale locks, guards the gate GPU (GATE_GPU in cores.env) and writes /workspace/STATUS.json + supervisor.heartbeat.
[program:box-supervisor]
command=/usr/bin/python3 /workspace/bin/box-supervisor
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=20
stdout_logfile=/workspace/logs/box-supervisor.stdout.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2
redirect_stderr=true
